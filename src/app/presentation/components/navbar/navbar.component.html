<nav class="navbar">
  <div class="navbar__brand">
    <a href="#">
      <img
        src="/assets/img/logo.png"
        alt="Logo"
        class="logo"
        width="32"
        height="32"
      />
    </a>
  </div>
  <ul class="navbar__menu">
    @for (item of menu.items; track item.path) {
      <li class="item" [routerLinkActive]="['active']">
        <a [routerLink]="item.path">{{ item.label }}</a>
      </li>
    }
  </ul>
</nav>
